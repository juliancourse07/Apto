<style>
body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:#f6f8fb; color:#172b4d; }
.header { padding:16px 20px; background:#17365D; color:white; }
.header h1 { margin:0; font-size:22px; } .header p { margin:6px 0 0; opacity:.9; }
.layout { display:grid; grid-template-columns: 350px 1fr; height: calc(100vh - 76px); }
.panel { padding:14px; overflow:auto; background:white; border-right:1px solid #d9e1f2; }
#map { height:100%; width:100%; }
.card { background:#fff; border:1px solid #e6eaf2; border-radius:14px; padding:10px; margin:10px 0; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.kpi { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:8px 0; } .kpi div { background:#eef6ff; border-radius:12px; padding:10px; }
label { display:block; font-weight:700; margin-top:10px; font-size:13px; }
select,input { width:100%; padding:8px; border:1px solid #ccd6e6; border-radius:10px; margin-top:4px; }
button { width:100%; padding:9px; border:0; border-radius:10px; background:#00A6A6; color:white; font-weight:700; cursor:pointer; margin-top:10px; }
.badge { display:inline-block; border-radius:999px; padding:3px 8px; color:white; font-size:12px; }
.Alta { background:#1a9850; } .Media { background:#fdae61; } .Baja { background:#f46d43; } .Descartar { background:#999; }
a { color:#0b66c3; text-decoration:none; } a:hover { text-decoration:underline; }
.small { font-size:12px; color:#5f6c7b; }
@media(max-width:900px){ .layout{grid-template-columns:1fr; height:auto;} #map{height:70vh;} }
</style>
</head>
<body>
<div class="header"><h1>Apto - Mapa de ofertas Medellín y municipios aledaños</h1><p>Filtro por precio, municipio y prioridad | Coordenadas aproximadas por barrio/sector cuando el portal no publica dirección exacta.</p></div>
<div class="layout">
  <div class="panel">

    <label>Precio mínimo COP</label><input id="minPrice" type="number" value="1300000" step="50000">
    <label>Precio máximo COP</label><input id="maxPrice" type="number" value="2400000" step="50000">
    <label>Municipio</label><select id="mun"><option value="Todos">Todos</option></select>
    <label>Prioridad mínima</label><select id="prio"><option value="Todas">Todas</option><option value="Alta">Alta</option><option value="Media">Media o Alta</option><option value="Baja">Baja o superior</option></select>
    <label>Buscar texto</label><input id="q" type="text" placeholder="barrio, portal, metro, notas...">
    <button onclick="applyFilters()">Aplicar filtros</button>
    <button onclick="resetFilters()" style="background:#6b778d">Reiniciar</button>
    <div id="list"></div>
  </div>
  <div id="map"></div>
</div>

function filtered() {
 const min=Number(document.getElementById('minPrice').value||0), max=Number(document.getElementById('maxPrice').value||999999999);
 const mun=document.getElementById('mun').value, prio=document.getElementById('prio').value, q=(document.getElementById('q').value||'').toLowerCase();
 return offers.filter(o=>o.Precio>=min && o.Precio<=max && (mun==='Todos'||o.Municipio===mun) && (prio==='Todas'||prioRank[o.Prioridad]>=prioRank[prio]) && JSON.stringify(o).toLowerCase().includes(q));
}
